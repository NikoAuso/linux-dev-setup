name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shellcheck --version
          # -x: segue i file sorgenti (# shellcheck source=)
          # -S warning: fallisce su error/warning, ignora il rumore info/style
          find . -name '*.sh' -print0 | xargs -0 -r shellcheck -x -S warning
